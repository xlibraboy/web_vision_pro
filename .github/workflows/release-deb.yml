# Builds the Ubuntu 22.04 .deb and attaches it to a GitHub Release.
#
# Releasing: bump AppVersion::kNumber, move the CHANGELOG.md entries under a
# new version heading, commit, then push a tag (vX.Y.Z). A manual run via
# "Run workflow" only produces build artifacts.
#
# Prerequisites:
#   - repository secret PYLON_DEB_URL: download URL of the Basler pylon 6.2
#     deb (the build links against the SDK; the package never redistributes it)
#   - the .deb targets Ubuntu 22.04: Ubuntu 20.04 keeps using the Docker image
#     (.docker/Dockerfile), whose Qt is too old for the app's OPC UA code
name: Release .deb

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deb:
    name: Build .deb (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    env:
      PYLON_DEB_URL: ${{ secrets.PYLON_DEB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: packaging/build-deb.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: papervision-deb
          path: |
            packaging/out/*.deb
            packaging/out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Generated notes (one line per commit) plus the install footer.
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body > /tmp/release-notes.md
            printf '\n' >> /tmp/release-notes.md
            cat packaging/release-notes-footer.md >> /tmp/release-notes.md
            gh release create "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" \
            packaging/out/*.deb packaging/out/SHA256SUMS.txt --clobber
