# GigE Vision kernel buffers for PaperVision camera streaming. Applied by
# systemd-sysctl at boot; "sudo sysctl --system" applies it immediately.
# Override by dropping a file of the same name into /etc/sysctl.d/.
net.core.rmem_max = 26214400
net.core.rmem_default = 26214400
net.core.wmem_max = 26214400
net.core.wmem_default = 26214400
